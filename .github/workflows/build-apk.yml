name: Build Hero Tran Launcher APK

# Chay khi: push len main/master, PR, bam nut Run workflow, hoac push tag v* de tao Release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Can quyen ghi de tao Release khi push tag
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build-tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools/"

      - name: Tim thu muc project
        id: project
        run: |
          if [ -f "AndroidManifest.xml" ]; then
            DIR="."
          elif [ -f "hero Tran_launcher source code/AndroidManifest.xml" ]; then
            DIR="hero Tran_launcher source code"
          else
            FOUND=$(find . -maxdepth 3 -name "AndroidManifest.xml" -not -path "./build/*" | head -n 1)
            DIR=$(dirname "$FOUND")
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$DIR"
          ls -l "$DIR/AndroidManifest.xml" "$DIR/build.sh"

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x "$PROJECT_DIR/build.sh"
          if [ -z "$KEYSTORE_PASSWORD" ]; then export KEYSTORE_PASSWORD=android; fi
          if [ -z "$KEY_ALIAS" ]; then export KEY_ALIAS=vnhero; fi
          if [ -z "$KEY_PASSWORD" ]; then export KEY_PASSWORD=android; fi
          bash "$PROJECT_DIR/build.sh"
          ls -lh "$PROJECT_DIR/build/"*.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$PROJECT_DIR/build/tvlauncher.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-tran-launcher-apk
          path: |
            ${{ steps.project.outputs.dir }}/build/tvlauncher.apk
            ${{ steps.project.outputs.dir }}/build/hero-tran-launcher.apk
          if-no-files-found: error
          retention-days: 30

      - name: "Tao Release khi push tag v*"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.project.outputs.dir }}/build/tvlauncher.apk
            ${{ steps.project.outputs.dir }}/build/hero-tran-launcher.apk
          body: |
            Hero Tran Launcher - build tu GitHub Actions.
            Cai dat: chep file .apk len TV / Box Android va cai dat.
